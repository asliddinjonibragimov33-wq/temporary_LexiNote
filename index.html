<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Korean Vocabulary Quiz</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">
        <div class="logo">
            🇰🇷 Korean Quiz
        </div>

        <div class="header-info">
            <span id="score">Ball: 0</span>
        </div>
    </header>


    <!-- =========================
         MAIN
    ========================== -->
    <main class="container">

        <!-- INTRO -->
        <section class="intro">
            <h1>Koreys tili lug‘at so‘ragichi</h1>

            <p>
                Seoul National University kitoblaridagi
                lug‘atlar yordamida so‘zlarni yodlang.
            </p>
        </section>


        <!-- =========================
            SELECTION CARD
        ========================== -->
        <section class="selection-card">

            <!-- KITOB TANLASH -->
            <div class="select-group">
                <label for="bookSelect">
                    Kitobni tanlang
                </label>

                <select id="bookSelect">
                    <option value="">Kitobni tanlang</option>
                    <option value="1A">1A</option>
                    <option value="1B">1B</option>
                    <option value="2A">2A</option>
                    <option value="2B">2B</option>
                    <option value="3A">3A</option>
                    <option value="3B">3B</option>
                    <option value="4A">4A</option>
                    <option value="4B">4B</option>
                    <option value="5A">5A</option>
                    <option value="5B">5B</option>
                </select>
            </div>


            <!-- MAVZU TANLASH -->
            <div class="select-group">
                <label for="topicSelect">
                    Mavzuni tanlang
                </label>

                <select id="topicSelect" disabled>
                    <option value="">
                        Avval kitobni tanlang
                    </option>
                </select>
            </div>


            <!-- =========================
                QUIZ YO‘NALISHI
            ========================== -->
            <div class="direction-group">

                <label>
                    Lug‘at so‘rash yo‘nalishi
                </label>

                <div class="direction-options">

                    <label class="direction-option">
                        <input
                            type="radio"
                            name="direction"
                            value="ko-uz"
                            checked
                        >

                        <span>
                            🇰🇷 Koreyscha
                            <strong>→</strong>
                            🇺🇿 O‘zbekcha
                        </span>
                    </label>


                    <label class="direction-option">
                        <input
                            type="radio"
                            name="direction"
                            value="uz-ko"
                        >

                        <span>
                            🇺🇿 O‘zbekcha
                            <strong>→</strong>
                            🇰🇷 Koreyscha
                        </span>
                    </label>

                </div>

            </div>


            <!-- BOSHLASH -->
            <button id="startBtn" class="start-btn" disabled>
                Boshlash
            </button>

        </section>


        <!-- =========================
             QUIZ
        ========================== -->
        <section id="quizSection" class="quiz-section hidden">

            <div class="quiz-top">

                <span id="questionNumber">
                    1 / 10
                </span>

                <span id="quizScore">
                    Ball: 0
                </span>

            </div>


            <div class="word-card">

                <p class="word-label">
                    Koreyscha so‘z
                </p>

                <h2 id="koreanWord">
                    나라
                </h2>

            </div>


            <div class="answer-area">

                <label for="answerInput">
                    O‘zbekcha tarjimasini yozing
                </label>

                <input
                    type="text"
                    id="answerInput"
                    placeholder="Tarjimani kiriting..."
                    autocomplete="off"
                >

                <button id="checkBtn" class="check-btn">
                    Tekshirish
                </button>

            </div>


            <div id="result" class="result"></div>


            <button id="nextBtn" class="next-btn hidden">
                Keyingi so‘z
            </button>

        </section>


        <!-- =========================
             FINISH
        ========================== -->
        <section id="resultSection" class="finish-section hidden">

            <h2>Quiz tugadi! 🎉</h2>

            <p id="finalScore">
                Natija: 0 / 10
            </p>

            <button id="restartBtn" class="restart-btn">
                Qaytadan boshlash
            </button>

        </section>

    </main>


    <!-- =========================
         FOOTER
    ========================== -->
    <footer class="footer">
        <p>
            Korean Vocabulary Quiz
        </p>
    </footer>


    <!-- JavaScript -->
    <script src="../js/lugatlar.js"></script>
    <script src="../js/script.js"></script>

</body>
</html>
